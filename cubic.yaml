# yaml-language-server: $schema=https://cubic.dev/schema/cubic-repository-config.schema.json

version: 1

reviews:
  custom_rules:
    - name: BrowseActra docs prose guide
      description: Enforce prose style, voice, clarity, and structure for changed BrowseActra documentation.
      file_paths:
        - .cubic/docs-style-guide.md
      include:
        - README.md
        - docs/**
        - apps/web/**
