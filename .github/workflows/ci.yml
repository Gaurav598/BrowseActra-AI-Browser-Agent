name: BrowseActra CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.11.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared protocol
        run: pnpm --dir packages/protocol build

      - name: Build browser extension
        run: pnpm --dir packages/extension build

      - name: Build TypeScript SDK
        run: pnpm --dir packages/sdk-ts build

      - name: Typecheck core packages
        run: |
          pnpm --dir packages/protocol typecheck
          pnpm --dir packages/extension typecheck
          pnpm --dir packages/sdk-ts typecheck
          pnpm --dir packages/browseactra-runtime typecheck
          pnpm --dir packages/browseactra-verifier typecheck
          pnpm --dir packages/browseactra-executor typecheck
          pnpm --dir packages/browseactra-sdk typecheck
          pnpm --dir packages/browseactra-cli typecheck
          pnpm --dir apps/api typecheck

      - name: Build BrowseActra application, SDK, and CLI
        run: pnpm build:browseactra

      - name: Check BrowseActra identity
        run: pnpm brand:check

      - name: Check formatting
        run: pnpm fmt:check

      - name: Lint workspace
        run: pnpm lint

      - name: Run offline unit tests
        run: |
          pnpm --dir packages/protocol test:unit
          pnpm --dir packages/extension test:unit
          pnpm --dir packages/sdk-ts test:unit
          pnpm --dir packages/browseactra-runtime test
          pnpm --dir packages/browseactra-verifier test
          pnpm --dir packages/browseactra-executor test
          pnpm --dir packages/browseactra-sdk test
          pnpm --dir apps/api test

      - name: Install Chromium for local integration test
        run: pnpm --dir packages/browseactra-runtime exec playwright install --with-deps chromium

      - name: Run deterministic browser end-to-end test
        run: pnpm exec tsx tests/e2e/local-browser.ts
